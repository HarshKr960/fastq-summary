name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint with flake8
        run: flake8 fastq_summary tests --max-line-length=100

      - name: Run tests with coverage
        run: pytest --cov=fastq_summary --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml

  cli-smoke-test:
    name: CLI smoke test on sample data
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install .

      - name: Run CLI against fixture FASTQ
        run: |
          fastq-summary tests/data/sample.fastq --json | tee summary.json
          python -c "import json; d=json.load(open('summary.json')); assert d[0]['num_reads'] == 4, d"
