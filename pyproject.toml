[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastq-summary"
version = "0.1.0"
description = "Fast, dependency-free FASTQ summary statistics (read count, length, GC%, quality)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
fastq-summary = "fastq_summary.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "flake8>=6"]

[tool.setuptools.packages.find]
include = ["fastq_summary*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
